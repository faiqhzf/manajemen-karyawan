<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Karyawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">Direktori Karyawan</h1>
            <span id="status-badge" class="px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 hidden">Tersinkronisasi</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                <h2 class="text-lg font-semibold mb-4" id="form-title">Tambah Data Baru</h2>
                <form id="karyawan-form" class="space-y-4">
                    <input type="hidden" id="karyawan-id">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                        <input type="text" id="nama" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Departemen</label>
                        <select id="departemen" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                            <option value="">Pilih Departemen...</option>
                            <option value="IT">IT</option>
                            <option value="Finance">Finance</option>
                            <option value="HR">HR</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Operations">Operations</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gaji Pokok (Rp)</label>
                        <input type="number" id="gaji" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <div class="pt-2 flex gap-2">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">Simpan</button>
                        <button type="button" onclick="resetForm()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors">Batal</button>
                    </div>
                </form>
            </div>

            <div class="col-span-1 md:col-span-2 space-y-4">
                
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
                    
                    <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-200">
                        <svg class="w-5 h-5 text-gray-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="search-input" placeholder="Cari berdasarkan ID atau Nama Karyawan..." class="w-full bg-transparent border-none focus:ring-0 outline-none text-gray-700 placeholder-gray-400">
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3">
                        <select id="filter-departemen" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 text-sm text-gray-700">
                            <option value="">Semua Departemen</option>
                            <option value="IT">Departemen IT</option>
                            <option value="Finance">Departemen Finance</option>
                            <option value="HR">Departemen HR</option>
                            <option value="Marketing">Departemen Marketing</option>
                            <option value="Operations">Departemen Operations</option>
                        </select>

                        <select id="sort-data" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 text-sm text-gray-700">
                            <option value="terbaru">Data Terbaru (ID Terbesar)</option>
                            <option value="terlama">Data Terlama (ID Terkecil)</option>
                            <option value="gaji_tertinggi">Gaji Tertinggi</option>
                            <option value="gaji_terendah">Gaji Terendah</option>
                        </select>
                    </div>

                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 text-gray-600 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">ID</th>
                                    <th class="px-6 py-4 font-semibold">Nama Karyawan</th>
                                    <th class="px-6 py-4 font-semibold">Departemen</th>
                                    <th class="px-6 py-4 font-semibold">Gaji (Rp)</th>
                                    <th class="px-6 py-4 font-semibold text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="divide-y divide-gray-100">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/karyawan';
        const form = document.getElementById('karyawan-form');
        const tableBody = document.getElementById('table-body');
        const formTitle = document.getElementById('form-title');
        const statusBadge = document.getElementById('status-badge');
        
        // Elemen Kontrol
        const searchInput = document.getElementById('search-input');
        const filterDepartemen = document.getElementById('filter-departemen');
        const sortData = document.getElementById('sort-data');

        // State Manager
        let globalKaryawanData = [];

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID').format(angka);

        const showStatus = (message, isError = false) => {
            statusBadge.textContent = message;
            statusBadge.className = `px-3 py-1 rounded-full text-sm font-medium ${isError ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`;
            statusBadge.classList.remove('hidden');
            setTimeout(() => statusBadge.classList.add('hidden'), 3000);
        };

        // READ: Pengambilan data primer
        async function fetchKaryawan() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                globalKaryawanData = data; 
                applyFiltersAndSort(); // Eksekusi penyaringan pertama kali
            } catch (error) {
                showStatus('Gagal memuat data dari peladen', true);
            }
        }

        // MESIN AGREGASI: Penyaringan dan Pengurutan
        function applyFiltersAndSort() {
            const keyword = searchInput.value.toLowerCase();
            const dept = filterDepartemen.value;
            const sortMethod = sortData.value;

            // 1. Eksekusi Filter (Teks & Departemen)
            let result = globalKaryawanData.filter(karyawan => {
                const matchSearch = karyawan.nama.toLowerCase().includes(keyword) || karyawan.id.toString().includes(keyword);
                const matchDept = dept === "" || karyawan.departemen === dept;
                return matchSearch && matchDept;
            });

            // 2. Eksekusi Pengurutan (Gaji & ID)
            result.sort((a, b) => {
                if (sortMethod === 'terbaru') return b.id - a.id;
                if (sortMethod === 'terlama') return a.id - b.id;
                if (sortMethod === 'gaji_tertinggi') return b.gaji - a.gaji;
                if (sortMethod === 'gaji_terendah') return a.gaji - b.gaji;
                return 0;
            });

            renderTable(result);
        }

        // Mendaftarkan Event Listener ke seluruh elemen kontrol
        searchInput.addEventListener('input', applyFiltersAndSort);
        filterDepartemen.addEventListener('change', applyFiltersAndSort);
        sortData.addEventListener('change', applyFiltersAndSort);

        // DOM Rendering
        function renderTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">Belum ada data atau kriteria tidak ditemukan.</td></tr>`;
                return;
            }

            data.forEach(karyawan => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4 text-gray-500">#${karyawan.id}</td>
                    <td class="px-6 py-4 font-medium text-gray-900">${karyawan.nama}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs font-medium">${karyawan.departemen}</span></td>
                    <td class="px-6 py-4 text-gray-700">${formatRupiah(karyawan.gaji)}</td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <button onclick="editKaryawan(${karyawan.id}, '${karyawan.nama}', '${karyawan.departemen}', ${karyawan.gaji})" class="text-blue-600 hover:text-blue-800 font-medium">Edit</button>
                        <button onclick="deleteKaryawan(${karyawan.id})" class="text-red-600 hover:text-red-800 font-medium">Hapus</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // CREATE & UPDATE
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('karyawan-id').value;
            const payload = {
                nama: document.getElementById('nama').value,
                departemen: document.getElementById('departemen').value,
                gaji: parseFloat(document.getElementById('gaji').value)
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    showStatus(id ? 'Data diperbarui' : 'Data ditambahkan');
                    resetForm();
                    fetchKaryawan(); 
                }
            } catch (error) {
                showStatus('Terjadi kesalahan transmisi', true);
            }
        });

        // Form Population
        function editKaryawan(id, nama, departemen, gaji) {
            document.getElementById('karyawan-id').value = id;
            document.getElementById('nama').value = nama;
            document.getElementById('departemen').value = departemen;
            document.getElementById('gaji').value = gaji;
            formTitle.textContent = `Edit Data #${id}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // DELETE
        async function deleteKaryawan(id) {
            if (!confirm(`Hapus data karyawan #${id}?`)) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showStatus('Data dihapus');
                    fetchKaryawan();
                }
            } catch (error) {
                showStatus('Gagal menghapus data', true);
            }
        }

        function resetForm() {
            form.reset();
            document.getElementById('karyawan-id').value = '';
            formTitle.textContent = 'Tambah Data Baru';
        }

        // Bootstrap
        fetchKaryawan();
    </script>
</body>
</html>
