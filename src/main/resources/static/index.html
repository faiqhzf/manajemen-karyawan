<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Karyawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .glass-hero {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute inset-0 bg-slate-900/40"></div>

    <div class="glass-hero relative z-10 max-w-2xl w-full p-12 rounded-[3rem] text-center shadow-2xl">
        <div class="w-20 h-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg shadow-blue-500/50">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5V9a2 2 0 00-2-2h-2a2 2 0 00-2 2v12H5m0 0H3m2 0h3M9 7h.01M9 11h.01M9 15h.01M15 7h.01M15 11h.01M15 15h.01"></path></svg>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight mb-4">Enterprise HRIS Portal</h1>
        <p class="text-lg text-slate-700 font-semibold mb-10 max-w-lg mx-auto">Platform terintegrasi untuk manajemen data staf, operasional departemen, dan administrasi perizinan secara real-time.</p>
        
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="/login.html" class="w-full sm:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-2xl transition-all shadow-lg shadow-blue-600/30">
                Akses Sistem Autentikasi
            </a>
            <a href="https://github.com/faiqhzf/manajemen-karyawan" target="_blank" class="w-full sm:w-auto px-8 py-4 bg-white hover:bg-slate-50 text-slate-800 border-2 border-slate-200 font-black rounded-2xl transition-all shadow-sm">
                Lihat Dokumentasi Repositori
            </a>
        </div>

        <div class="mt-12 pt-8 border-t border-slate-400/20">
            <p class="text-xs font-bold text-slate-600 uppercase tracking-widest">Sistem Manajemen Basis Data Berorientasi Objek &copy; 2026</p>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('hris_token')) {
            const role = sessionStorage.getItem('hris_role');
            window.location.href = role === 'ROLE_HRD' ? '/admin-hr.html' : '/karyawan.html';
        }
    </script>
</body>
</html>
