<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manajemen Karyawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --neu-bg: #dce4f0;
            --neu-shadow-dark: #b8c6d9;
            --neu-shadow-light: #ffffff;
            --accent: #5c43d6;
            --accent-hover: #4a34b2;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--neu-bg);
            overflow-x: hidden;
        }

        .neu-flat {
            background: var(--neu-bg);
            box-shadow: 12px 12px 24px var(--neu-shadow-dark), 
                        -12px -12px 24px var(--neu-shadow-light);
            border-radius: 3rem;
        }

        .neu-icon-container {
            background: var(--neu-bg);
            box-shadow: 8px 8px 16px var(--neu-shadow-dark), 
                       -8px -8px 16px var(--neu-shadow-light);
            border-radius: 50%;
        }

        .neu-pressed {
            background: var(--neu-bg);
            box-shadow: inset 6px 6px 12px var(--neu-shadow-dark), 
                        inset -6px -6px 12px var(--neu-shadow-light);
            border-radius: 1.25rem;
            border: none;
            outline: none;
        }
        
        .neu-pressed:focus {
            box-shadow: inset 8px 8px 16px var(--neu-shadow-dark), 
                        inset -8px -8px 16px var(--neu-shadow-light);
        }

        .neu-btn {
            background: var(--accent);
            box-shadow: 6px 6px 12px var(--neu-shadow-dark), 
                       -6px -6px 12px var(--neu-shadow-light);
            border-radius: 1.25rem;
            color: white;
            transition: all 0.2s ease-in-out;
        }

        .neu-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 8px 8px 16px var(--neu-shadow-dark), 
                       -8px -8px 16px var(--neu-shadow-light);
        }

        .neu-btn:active {
            box-shadow: inset 4px 4px 8px #3c2a9a, 
                        inset -4px -4px 8px #7c5cff;
            transform: translateY(0);
        }
        
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px var(--neu-bg) inset !important;
            -webkit-text-fill-color: #334155 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans text-slate-700 p-4">

    <div class="neu-flat w-full max-w-[360px] p-10 flex flex-col items-center relative animate-[fadeIn_0.3s_ease-in-out]">
        
        <div class="neu-icon-container p-1.5 w-24 h-24 flex items-center justify-center mb-6 border-4 border-[#dce4f0] overflow-hidden">
            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=PortalAkses" alt="Login Avatar" class="w-full h-full object-cover">
        </div>

        <h1 class="text-xl font-black text-slate-800 mb-1">Portal Autentikasi</h1>
        <p class="text-[10px] font-bold text-slate-500 tracking-widest uppercase mb-10">Manajemen Pegawai</p>

        <div id="error-message" class="hidden w-full mb-6 flex items-start gap-3 p-4 bg-rose-100/50 border border-rose-200 rounded-2xl text-rose-600 animate-[pulse_0.5s_ease-in-out] shadow-sm">
            <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <p class="text-xs font-black" id="error-text">Kredensial tidak valid.</p>
        </div>

        <form id="login-form" class="w-full space-y-5" autocomplete="off">
            
            <div class="relative flex items-center">
                <div class="absolute left-5 text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <input type="text" id="username" required class="neu-pressed w-full py-4 pl-12 pr-5 text-xs font-black text-slate-700 placeholder:text-slate-400 placeholder:font-bold" placeholder="Username">
            </div>

            <div class="relative flex items-center">
                <div class="absolute left-5 text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <input type="password" id="password" required class="neu-pressed w-full py-4 pl-12 pr-5 text-xs font-black text-slate-700 placeholder:text-slate-400 placeholder:font-bold" placeholder="Password">
            </div>

            <button type="submit" id="submit-btn" class="neu-btn w-full py-4 mt-2 font-black text-sm tracking-wide flex justify-center items-center gap-2">
                Masuk Sistem
            </button>

        </form>

        <div class="mt-8 text-center w-full">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                Lupa Sandi? <a href="#" onclick="alert('Silakan hubungi administrator HRD internal perusahaan untuk peresetan sandi.')" class="text-indigo-500 hover:text-indigo-700 transition-colors font-black">Hubungi HRD</a>
            </p>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('hris_token')) {
            const role = sessionStorage.getItem('hris_role');
            window.location.href = role === 'ROLE_HRD' ? '/admin-hr.html' : '/karyawan.html';
        }

        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('error-message');
        const errorMsg = document.getElementById('error-text');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            alertBox.classList.add('hidden');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            submitBtn.disabled = true;

            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    sessionStorage.setItem('hris_token', data.token);
                    sessionStorage.setItem('hris_role', data.role);
                    sessionStorage.setItem('hris_username', payload.username);
                    
                    window.location.href = data.role === 'ROLE_HRD' ? '/admin-hr.html' : '/karyawan.html';
                } else {
                    errorMsg.textContent = data.error || 'Username atau password ditolak peladen.';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.textContent = 'Gagal terhubung ke peladen backend.';
                alertBox.classList.remove('hidden');
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
