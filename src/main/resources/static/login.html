<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manajemen Karyawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            /* Warna latar utama Neumorphism */
            --neu-bg: #ecf0f3;
            --neu-shadow-dark: #c8cccf;
            --neu-shadow-light: #ffffff;
            /* Warna tombol utama (Cyan/Teal) */
            --btn-color: #55b9c3;
            --btn-shadow-dark: #469aa2;
            --btn-shadow-light: #64d8e4;
        }

      body {
            /* Menerapkan gambar latar belakang dari sumber eksternal/lokal */
            background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            /* Lapisan gradien opsional agar gambar tidak terlalu mencolok */
            box-shadow: inset 0 0 0 2000px rgba(236, 240, 243, 0.6);
        }

        /* Objek Timbul (Card) */
        .neu-flat {
            background: var(--neu-bg);
            box-shadow: 14px 14px 28px var(--neu-shadow-dark), 
                        -14px -14px 28px var(--neu-shadow-light);
            border-radius: 2rem;
        }

        /* Wadah Logo Timbul */
        .neu-logo-container {
            background: var(--neu-bg);
            box-shadow: 8px 8px 16px var(--neu-shadow-dark), 
                       -8px -8px 16px var(--neu-shadow-light);
            border-radius: 50%;
        }

        /* Area Teks Ditekan (Input) */
        .neu-pressed {
            background: var(--neu-bg);
            box-shadow: inset 6px 6px 12px var(--neu-shadow-dark), 
                        inset -6px -6px 12px var(--neu-shadow-light);
            border-radius: 1rem;
            border: none;
            outline: none;
        }
        
        .neu-pressed:focus {
            box-shadow: inset 8px 8px 16px var(--neu-shadow-dark), 
                        inset -8px -8px 16px var(--neu-shadow-light);
        }

        /* Tombol Aksi */
        .neu-btn {
            background: var(--btn-color);
            box-shadow: 6px 6px 12px var(--neu-shadow-dark), 
                       -6px -6px 12px var(--neu-shadow-light);
            border-radius: 1rem;
            color: white;
            transition: all 0.2s ease-in-out;
        }

        .neu-btn:hover {
            transform: translateY(2px);
            box-shadow: 4px 4px 8px var(--neu-shadow-dark), 
                       -4px -4px 8px var(--neu-shadow-light);
        }

        .neu-btn:active {
            box-shadow: inset 4px 4px 8px var(--btn-shadow-dark), 
                        inset -4px -4px 8px var(--btn-shadow-light);
        }
        
        /* Auto-fill override agar background input tidak berubah putih/kuning */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px var(--neu-bg) inset !important;
            -webkit-text-fill-color: #475569 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans text-slate-700 p-4">

    <div class="neu-flat w-full max-w-sm p-10 flex flex-col items-center relative">
        
        <div class="neu-logo-container p-2 w-20 h-20 flex items-center justify-center mb-6">
            <svg class="w-10 h-10 text-slate-800" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5V9a2 2 0 00-2-2h-2a2 2 0 00-2 2v12H5m0 0H3m2 0h3M9 7h.01M9 11h.01M9 15h.01M15 7h.01M15 11h.01M15 15h.01"></path>
            </svg>
        </div>

        <h1 class="text-xl font-bold text-slate-800 mb-1">Manajemen Karyawan</h1>
        <p class="text-xs font-semibold text-slate-500 tracking-widest uppercase mb-10">Portal Akses Sistem</p>

        <div id="error-message" class="hidden w-full mb-6 flex items-start gap-3 p-4 bg-red-50/50 border border-red-200 rounded-xl text-red-600 animate-[pulse_0.5s_ease-in-out]">
            <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <p class="text-sm font-bold" id="error-text">Kredensial tidak valid.</p>
        </div>

        <form id="login-form" class="w-full space-y-6" autocomplete="off">
            
            <div class="relative flex items-center">
                <div class="absolute left-4 text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <input type="text" id="username" required class="neu-pressed w-full py-4 pl-12 pr-4 text-sm font-medium text-slate-700 placeholder:text-slate-400" placeholder="username">
            </div>

            <div class="relative flex items-center">
                <div class="absolute left-4 text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <input type="password" id="password" required class="neu-pressed w-full py-4 pl-12 pr-4 text-sm font-medium text-slate-700 placeholder:text-slate-400" placeholder="password">
            </div>

            <button type="submit" id="submit-btn" class="neu-btn w-full py-4 mt-4 font-bold text-sm tracking-wide flex justify-center items-center gap-2">
                <span>Login</span>
            </button>

        </form>

        <div class="mt-8 text-center w-full">
            <p class="text-[11px] font-bold text-slate-400">
                Lupa sandi? <a href="#" onclick="alert('Silakan hubungi administrator HRD untuk mengatur ulang sandi.')" class="text-slate-600 hover:text-slate-800 transition-colors">Hubungi Admin</a>
            </p>
        </div>
    </div>

    <script>
        // Mencegah login ulang jika token masih valid
        if (sessionStorage.getItem('hris_token')) {
            const role = sessionStorage.getItem('hris_role');
            window.location.href = role === 'ROLE_HRD' ? '/admin-hr.html' : '/karyawan.html';
        }

        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('error-message');
        const errorMsg = document.getElementById('error-text');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            alertBox.classList.add('hidden');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            submitBtn.disabled = true;

            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    sessionStorage.setItem('hris_token', data.token);
                    sessionStorage.setItem('hris_role', data.role);
                    sessionStorage.setItem('hris_username', payload.username);
                    
                    window.location.href = data.role === 'ROLE_HRD' ? '/admin-hr.html' : '/karyawan.html';
                } else {
                    errorMsg.textContent = data.error || 'Username atau password tidak valid.';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.textContent = 'Gagal terhubung ke peladen. Pastikan server beroperasi.';
                alertBox.classList.remove('hidden');
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
