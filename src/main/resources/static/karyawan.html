<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Karyawan - MyHRIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] text-slate-700 font-sans antialiased min-h-screen flex flex-col">

    <script>
        const token = sessionStorage.getItem('hris_token');
        const role = sessionStorage.getItem('hris_role');
        
        if (!token || role !== 'ROLE_KARYAWAN') {
            sessionStorage.clear();
            window.location.href = '/login.html';
        }
    </script>

    <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-600 rounded-lg text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-lg">MyHRIS Karyawan</h1>
                <span class="text-xs font-semibold text-slate-400 block">Dasbor Profil Pribadi</span>
            </div>
        </div>
        <button onclick="handleLogout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 px-4 rounded-xl border border-red-200 text-sm transition-colors">
            Keluar Sistem
        </button>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-lg">
            
            <div id="loading-state" class="text-center py-10">
                <p class="text-slate-500 font-medium animate-pulse">Mengambil data dari peladen...</p>
            </div>

            <div id="error-state" class="hidden text-center py-10">
                <div class="inline-flex p-3 bg-red-50 text-red-600 rounded-full mb-3">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <p class="text-slate-800 font-bold" id="error-text">Gagal memuat profil</p>
                <p class="text-slate-500 text-sm mt-2">Data karyawan tidak ditemukan atau belum dikaitkan dengan akun login ini.</p>
            </div>

            <div id="profile-content" class="hidden">
                <div class="flex items-center gap-5 mb-8 border-b border-slate-100 pb-6">
                    <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 text-3xl font-bold border-4 border-white shadow-md" id="profil-inisial"></div>
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900" id="profil-nama"></h2>
                        <p class="text-sm font-semibold text-slate-500 mt-1">ID Karyawan: #<span id="profil-id"></span></p>
                    </div>
                </div>
                
                <div id="modul-cuti" class="mt-8 pt-6 border-t border-slate-100 hidden mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-900 text-lg">Riwayat Cuti</h3>
                        <button onclick="document.getElementById('modal-cuti').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-4 rounded-xl transition-colors shadow-sm">Ajukan Cuti</button>
                    </div>
                    <div class="overflow-x-auto rounded-xl border border-slate-200">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider font-bold border-b border-slate-200">
                                <tr>
                                    <th class="px-4 py-3">Mulai</th>
                                    <th class="px-4 py-3">Selesai</th>
                                    <th class="px-4 py-3">Alasan</th>
                                    <th class="px-4 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-cuti" class="divide-y divide-slate-100 font-medium text-slate-700">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Departemen</p>
                            <p class="text-slate-900 font-bold" id="profil-dept"></p>
                        </div>
                        <div class="text-slate-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                    </div>

                    <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-emerald-600/70 uppercase tracking-wider mb-1">Gaji Pokok</p>
                            <p class="text-emerald-700 font-bold text-xl" id="profil-gaji"></p>
                        </div>
                        <div class="text-emerald-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-cuti" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-xl">
            <h3 class="font-bold text-lg mb-4 text-slate-900">Form Pengajuan Cuti</h3>
            
            <div id="form-error-msg" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-xs font-bold rounded-xl border border-red-100 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span id="form-error-text">Terjadi kesalahan.</span>
            </div>

            <form id="form-pengajuan-cuti" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Tanggal Mulai</label>
                    <input type="date" id="tgl-mulai" required class="w-full px-3 py-2 border border-slate-300 rounded-xl outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Tanggal Selesai</label>
                    <input type="date" id="tgl-selesai" required class="w-full px-3 py-2 border border-slate-300 rounded-xl outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Alasan Cuti</label>
                    <textarea id="alasan-cuti" required class="w-full px-3 py-2 border border-slate-300 rounded-xl outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-xl font-bold text-sm">Kirim</button>
                    <button type="button" onclick="document.getElementById('modal-cuti').classList.add('hidden')" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl font-bold text-sm">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleLogout() {
            sessionStorage.clear();
            window.location.href = '/login.html';
        }

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        async function fetchMyProfile() {
            try {
                const response = await fetch('/api/karyawan/me', {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                document.getElementById('loading-state').classList.add('hidden');

                if (response.ok) {
                    const data = await response.json();
                    
                    document.getElementById('profil-inisial').textContent = data.nama.substring(0, 2).toUpperCase();
                    document.getElementById('profil-nama').textContent = data.nama;
                    document.getElementById('profil-id').textContent = data.id;
                    document.getElementById('profil-dept').textContent = data.departemen;
                    document.getElementById('profil-gaji').textContent = formatRupiah(data.gaji);
                    
                    document.getElementById('profile-content').classList.remove('hidden');
                    
                    fetchRiwayatCuti();
                    
                } else {
                    document.getElementById('error-state').classList.remove('hidden');
                    if (response.status === 401 || response.status === 403) {
                        handleLogout(); 
                    }
                }
            } catch (error) {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }
        }

        async function fetchRiwayatCuti() {
            try {
                const response = await fetch('/api/cuti/me', { headers: { 'Authorization': `Bearer ${token}` } });
                if (response.ok) {
                    const data = await response.json();
                    const tbody = document.getElementById('tabel-cuti');
                    tbody.innerHTML = '';
                    
                    if(data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-3 text-center text-slate-400 text-xs">Belum ada pengajuan cuti</td></tr>`;
                    } else {
                        data.forEach(c => {
                            const statusColor = c.status === 'DISETUJUI' ? 'text-emerald-600' : (c.status === 'DITOLAK' ? 'text-red-600' : 'text-amber-600');
                            tbody.innerHTML += `
                                <tr class="border-b border-slate-50 last:border-0">
                                    <td class="px-4 py-3">${c.tanggalMulai}</td>
                                    <td class="px-4 py-3">${c.tanggalSelesai}</td>
                                    <td class="px-4 py-3 truncate max-w-[150px]" title="${c.alasan}">${c.alasan}</td>
                                    <td class="px-4 py-3 font-bold ${statusColor}">${c.status}</td>
                                </tr>
                            `;
                        });
                    }
                    document.getElementById('modul-cuti').classList.remove('hidden');
                }
            } catch (error) { console.error('Gagal memuat cuti', error); }
        }

        document.getElementById('form-pengajuan-cuti').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorContainer = document.getElementById('form-error-msg');
            errorContainer.classList.add('hidden');

            const payload = {
                tanggalMulai: document.getElementById('tgl-mulai').value,
                tanggalSelesai: document.getElementById('tgl-selesai').value,
                alasan: document.getElementById('alasan-cuti').value
            };

            try {
                const response = await fetch('/api/cuti', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('modal-cuti').classList.add('hidden');
                    document.getElementById('form-pengajuan-cuti').reset();
                    fetchRiwayatCuti(); 
                } else {
                    const err = await response.json();
                    document.getElementById('form-error-text').textContent = err.error || 'Pastikan tanggal valid dan rasional.';
                    errorContainer.classList.remove('hidden');
                }
            } catch(error) {
                document.getElementById('form-error-text').textContent = 'Terjadi kesalahan koneksi ke peladen.';
                errorContainer.classList.remove('hidden');
            }
        });

        fetchMyProfile();
        
    </script>
</body>
</html>
